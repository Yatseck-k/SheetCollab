name: sheetcollab-prod

x-app-env: &app-env
  APP_ENV: production
  APP_DEBUG: "false"
  APP_URL: ${APP_URL:?Set APP_URL in .env.production}
  APP_KEY: ${APP_KEY:?Set APP_KEY in .env.production}
  LOG_CHANNEL: stderr
  LOG_LEVEL: warning
  DB_CONNECTION: mariadb
  DB_HOST: mariadb
  DB_PORT: "3306"
  DB_DATABASE: ${DB_DATABASE:?Set DB_DATABASE in .env.production}
  DB_USERNAME: ${DB_USERNAME:?Set DB_USERNAME in .env.production}
  DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env.production}
  SESSION_DRIVER: database
  SESSION_SECURE_COOKIE: "true"
  TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}

services:
  app:
    build:
      context: .
      dockerfile: docker/production/Dockerfile
    image: sheetcollab/app:php8.5.12
    env_file:
      - .env.production
    environment: *app-env
    ports:
      - "127.0.0.1:${APP_HTTP_PORT:-8088}:8080"
    volumes:
      - app-storage:/var/www/html/storage/app
    depends_on:
      mariadb:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - php
        - -r
        - "exit(@file_get_contents('http://127.0.0.1:8080/up') === false ? 1 : 0);"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    networks:
      - app

  scheduler:
    image: sheetcollab/app:php8.5.12
    command: ["php", "artisan", "schedule:work"]
    env_file:
      - .env.production
    environment: *app-env
    depends_on:
      app:
        condition: service_healthy
      mariadb:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'artisan schedule:work' > /dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - app

  mariadb:
    image: mariadb:12.3.3
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env.production}
      MARIADB_DATABASE: ${DB_DATABASE:?Set DB_DATABASE in .env.production}
      MARIADB_USER: ${DB_USERNAME:?Set DB_USERNAME in .env.production}
      MARIADB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env.production}
      MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: "no"
    volumes:
      - prod-mariadb:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - app

networks:
  app:
    driver: bridge

volumes:
  app-storage:
    driver: local
  prod-mariadb:
    driver: local
